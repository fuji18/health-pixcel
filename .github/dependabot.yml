# 依存関係・Actions・devcontainer を週次でチェックする(プロダクト向けの monthly 化は /kickoff フェーズ4)
version: 2
updates:
  # アプリ本体(Flutter)。pubspec.yaml は最初の実装チケットで生成される
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly

  # ハーネス専用(husky / lint-staged / secretlint / prettier)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # devDependencies は 1 PR にまとめてレビューコストを下げる
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
